# 大發輸入法預設行為疊加（不改上游 iridium_bpmf.schema.yaml）
patch:
  # 預設中文（上游 reset: 1 是英數）
  "switches/@0/reset": 0
  # 空白鍵＝一聲（2026-07-11 撤銷早期「空白送首選」patch）：
  # 上游 schema 原生 use_space: true、alphabet/finals 含空格，空白進 speller 當
  # 一聲字根，否則一聲字打不出來。選字確認改用點候選或 Enter（Trime 層攔截）。
  # editor 仍用 express_editor：空白被 speller 先吃，editor 摸不到空白鍵。
  # 手機用點候選列選字，關掉數字鍵選字（否則大千 ㄚㄞㄢ 等在數字鍵位會被當選字鍵）
  "menu/alternative_select_keys": ""
  # 打太快亂序時（如 ㄨ 比 ㄕ 先按到）上游 preedit 會顯示「(ㄕ+ㄨㄛ)」括號加號
  # 標記校正——容錯與上游規則照舊，只追加一條尾規則清掉標記字元
  # （追加而非整段覆寫：上游更新 preedit_format 時自動跟隨；先前整段複製曾把
  #  U+2002 音節分隔符抄成 ASCII 空格，被 xlit 誤轉成假一聲 ˉ）
  "translator/preedit_format/+":
    - xform/[()+]//
  "engine/processors":
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
