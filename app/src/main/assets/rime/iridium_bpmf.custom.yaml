# 大發輸入法預設行為疊加（不改上游 iridium_bpmf.schema.yaml）
patch:
  # 預設中文（上游 reset: 1 是英數）
  "switches/@0/reset": 0
  # 空白鍵＝一聲（2026-07-11 撤銷早期「空白送首選」patch）：
  # 上游 schema 原生 use_space: true、alphabet/finals 含空格，空白進 speller 當
  # 一聲字根，否則一聲字打不出來。選字確認改用點候選或 Enter（Trime 層攔截）。
  # editor 仍用 express_editor：空白被 speller 先吃，editor 摸不到空白鍵。
  # 手機用點候選列選字，關掉數字鍵選字（否則大千 ㄚㄞㄢ 等在數字鍵位會被當選字鍵）
  "menu/alternative_select_keys": ""
  "engine/processors":
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
