# Trime custom style settings — 大發輸入法主題
# encoding: utf-8
# W3：收合版三鍵盤（zhuyin 預設 / english / number）
# 大千鍵碼對照：ㄅ=1 ㄆ=q ㄇ=a ㄈ=z ㄉ=2 ㄊ=w ㄋ=s ㄌ=x ㄍ=e ㄎ=d ㄏ=c
#             ㄐ=r ㄑ=f ㄒ=v ㄓ=5 ㄔ=t ㄕ=g ㄖ=b ㄗ=y ㄘ=h ㄙ=n
#             ㄧ=u ㄨ=j ㄩ=m ㄚ=8 ㄛ=i ㄜ=k ㄝ=, ㄞ=9 ㄟ=o ㄠ=l ㄡ=.
#             ㄢ=0 ㄣ=p ㄤ=; ㄥ=/ ㄦ=- ˊ=6 ˇ=3 ˋ=4 ˙=7

config_version: "3.27"
name: dafa
author: Hau Liu

style:
  auto_caps: false
  background_dim_amount: 0.5
  root_background: keyboard_back_color
  candidate_font: han.ttf
  candidate_padding: 5
  candidate_spacing: 0.5
  candidate_text_size: 18
  candidate_use_cursor: true
  candidate_view_height: 28
  color_scheme: dafa_light
  comment_font: comment.ttf
  comment_height: 14
  comment_on_top: true
  comment_text_size: 12
  hanb_font: hanb.ttf
  horizontal: true
  # 間距/高度對齊 iOS 比例（iPhone 鍵 33x42pt、水平 gap 6、行距 11）：
  # 鍵要「瘦高」不要寬扁——gap 大、行距大、總高 290 讓 scale 後鍵高約 41dp
  horizontal_gap: 6
  layout:
    position: fixed
    min_length: 4
    max_length: 14
    sticky_lines: 1
    sticky_lines_land: 0
    max_entries: 5
    border: 0
    max_width: 360
    max_height: 300
    min_width: 0
    min_height: 50
    margin_x: 5
    margin_y: 5
    line_spacing: 0
    line_spacing_multiplier: 1.2
    real_margin: 3
    spacing: 1
    round_corner: 0
    alpha: 0xff
    elevation: 0
    background: background.png
    movable: false
    all_phrases: false
  key_font: symbol.ttf
  key_height: 48
  key_long_text_size: 16
  key_text_size: 20
  key_width: 10.0
  keyboards: [zhuyin, english, number, number_en, symbol, symbol_en, numpad, phonepad, zhuyin_land, english_land, number_land, number_en_land, symbol_land, symbol_en_land]
  label_text_size: 20
  label_font: label.ttf
  latin_font: latin.ttf
  latin_locale: en_US
  locale: zh_TW
  keyboard_height: 290
  # 摺疊機展開態（系統判 landscape 763x692dp）：居中收窄到 ~500dp 寬、高度對齊直屏手感
  keyboard_height_land: 260
  keyboard_padding_land: 0
  keyboard_padding_land_bottom: 12
  preview_font: latin.ttf
  preview_height: 56
  preview_offset: -12
  preview_text_size: 40
  proximity_correction: true
  reset_ascii_mode: true
  round_corner: 9
  shadow_radius: 0.0
  speech_opencc_config: none
  symbol_font: symbol.ttf
  symbol_text_size: 10
  text_font: latin.ttf
  text_size: 14
  vertical_correction: -5
  vertical_gap: 11
  enter_label_mode: 0
  enter_labels:
    go: 前往
    done: 完成
    next: 下個
    pre: 上個
    search: 搜尋
    send: 傳送
    default: ↵

fallback_colors:
  candidate_text_color: text_color
  comment_text_color: candidate_text_color
  border_color: back_color
  candidate_separator_color: border_color
  hilited_text_color: text_color
  hilited_back_color: back_color
  hilited_candidate_text_color: hilited_text_color
  hilited_candidate_back_color: hilited_back_color
  hilited_comment_text_color: comment_text_color
  hilited_key_back_color: hilited_candidate_back_color
  hilited_key_text_color: hilited_candidate_text_color
  hilited_key_symbol_color: hilited_comment_text_color
  hilited_off_key_back_color: hilited_key_back_color
  hilited_on_key_back_color: hilited_key_back_color
  hilited_off_key_text_color: hilited_key_text_color
  hilited_on_key_text_color: hilited_key_text_color
  key_back_color: back_color
  key_border_color: border_color
  key_text_color: candidate_text_color
  key_symbol_color: comment_text_color
  label_color: candidate_text_color
  off_key_back_color: key_back_color
  off_key_text_color: key_text_color
  on_key_back_color: hilited_key_back_color
  on_key_text_color: hilited_key_text_color
  preview_back_color: key_text_color
  preview_text_color: key_back_color
  shadow_color: border_color
  root_background: back_color
  candidate_background: back_color
  keyboard_back_color: border_color
  liquid_keyboard_background: keyboard_back_color
  text_back_color: back_color
  long_text_back_color: key_back_color

# 色彩對齊 iOS：鍵帽白/功能鍵 #ABB0BA/藍 #007AFF；深色版用 iOS 深色系 #0A84FF。
# return_key_*/function_key_* 是自訂色名，供 preset_keyboards 單鍵 override 引用
# （引用色名而非寫死色值，深淺色切換才會跟著變）
preset_color_schemes:
  dafa_light:
    name: "大發／淺色"
    author: Hau Liu
    dark_scheme: dafa_dark
    back_color: 0xffe8e9eb
    border_color: 0xffe8e9eb
    candidate_text_color: 0xff1c1c1e
    comment_text_color: 0xff8e8e93
    hilited_back_color: 0xffffffff
    hilited_candidate_back_color: 0xffffffff
    hilited_candidate_text_color: 0xff007aff
    hilited_comment_text_color: 0xff1c1c1e
    hilited_key_back_color: 0xffb8bcc4
    hilited_key_symbol_color: 0xff1c1c1e
    hilited_key_text_color: 0xff1c1c1e
    hilited_off_key_back_color: 0xffffffff
    hilited_off_key_text_color: 0xff1c1c1e
    hilited_text_color: 0xff1c1c1e
    key_back_color: 0xffffffff
    key_symbol_color: 0xff1c1c1e
    key_text_color: 0xff1c1c1e
    keyboard_back_color: 0xffe8e9eb
    label_color: 0xff1c1c1e
    off_key_back_color: 0xffabb0ba
    off_key_text_color: 0xff1c1c1e
    preview_back_color: 0xffffffff
    preview_text_color: 0xff1c1c1e
    text_color: 0xff007aff
    text_back_color: 0xffffffff
    return_key_back_color: 0xff007aff
    return_key_text_color: 0xffffffff
    return_key_hilited_back_color: 0xff0063cc
    function_key_back_color: 0xffabb0ba
    function_key_hilited_back_color: 0xffffffff
    key_shadow_color: 0xff898a8d

  dafa_dark:
    name: "大發／深色"
    author: Hau Liu
    light_scheme: dafa_light
    back_color: 0xff1c1c1e
    border_color: 0xff1c1c1e
    candidate_text_color: 0xffffffff
    comment_text_color: 0xff98989e
    hilited_back_color: 0xff2c2c2e
    hilited_candidate_back_color: 0xff2c2c2e
    hilited_candidate_text_color: 0xff0a84ff
    hilited_comment_text_color: 0xffffffff
    hilited_key_back_color: 0xff8e8e93
    hilited_key_symbol_color: 0xffffffff
    hilited_key_text_color: 0xffffffff
    hilited_off_key_back_color: 0xff6b6b6f
    hilited_off_key_text_color: 0xffffffff
    hilited_text_color: 0xffffffff
    key_back_color: 0xff6b6b6f
    key_symbol_color: 0xffffffff
    key_text_color: 0xffffffff
    keyboard_back_color: 0xff1c1c1e
    label_color: 0xffffffff
    off_key_back_color: 0xff464649
    off_key_text_color: 0xffffffff
    preview_back_color: 0xff6b6b6f
    preview_text_color: 0xffffffff
    text_color: 0xff0a84ff
    text_back_color: 0xff1c1c1e
    return_key_back_color: 0xff0a84ff
    return_key_text_color: 0xffffffff
    return_key_hilited_back_color: 0xff0774de
    function_key_back_color: 0xff464649
    function_key_hilited_back_color: 0xff6b6b6f
    key_shadow_color: 0x59000000

preset_keys:
  Shift_L: {label: ⇧, functional: false, send: Shift_L, shift_lock: ascii_long}
  Return: {label: enter_labels, functional: false, send: Return}
  BackSpace: {label: ⌫, repeatable: true, functional: false, send: BackSpace}
  space: {repeatable: false, functional: false, label: ' ', send: space}
  Keyboard_zhuyin: {label: 注音, functional: false, send: Eisu_toggle, select: zhuyin}
  Keyboard_english: {label: "🌐", functional: false, send: Eisu_toggle, select: english}
  Keyboard_number: {label: 123, functional: false, send: Eisu_toggle, select: number}
  Keyboard_symbol: {label: "#+=", functional: false, send: Eisu_toggle, select: symbol}
  # 系統語音輸入（SpeechRecognizer，TextInputManager 對 VOICE_ASSIST 攔截）
  Mic_placeholder: {label: "🎙", functional: false, send: VOICE_ASSIST}
  # 分離鍵盤（展開態）用
  Keyboard_number2: {label: "!#1", functional: false, send: Eisu_toggle, select: number}
  Keyboard_zhuyin_back: {label: 返回, functional: false, send: Eisu_toggle, select: zhuyin}
  Keyboard_zhuyin_globe: {label: "🌐", functional: false, send: Eisu_toggle, select: zhuyin}
  Keyboard_symbol_more: {label: 更多, functional: false, send: Eisu_toggle, select: symbol}
  # 英文流程的更多：直屏落 symbol_en（影子頁）、展開由 landRemap 換 symbol_en_land
  Keyboard_symbol_more_en: {label: 更多, functional: false, send: Eisu_toggle, select: symbol_en}
  # 英文模式專用數字符號頁（半形），與注音進的 number（全形）分流
  Keyboard_number_en: {label: 123, functional: false, send: Eisu_toggle, select: number_en}
  Keyboard_number2_en: {label: "!#1", functional: false, send: Eisu_toggle, select: number_en}
  Keyboard_abc: {label: ABC, functional: false, send: Eisu_toggle, select: english}
  Keyboard_english_back: {label: 返回, functional: false, send: Eisu_toggle, select: english}
  # symbol（更多）頁的 123：回進來前那頁（number 或 number_en）
  Keyboard_number_last: {label: 123, functional: false, send: Eisu_toggle, select: .last}
  # symbol 頁左下：回最後鎖定的主鍵盤（注音流程回 zhuyin、英文流程回 english）
  Keyboard_back_main: {label: 返回, functional: false, send: Eisu_toggle, select: .last_lock}
  Slash_commit: {label: '/', functional: false, commit: '/'}
  # 全形逗號直接上屏（不經 RIME，組字中不干擾）
  Comma_commit: {label: '，', functional: false, commit: '，'}
  Dun_commit: {label: '、', functional: false, commit: '、'}
  Apostrophe_commit: {label: "'", functional: false, commit: "'"}
  DotCom_commit: {label: ".com", functional: false, commit: ".com"}
  liquid_keyboard_emoji: {label: "😀", send: function, command: liquid_keyboard, option: emoji}

preset_keyboards:
  zhuyin:
    name: 注音鍵盤（收合）
    author: Hau Liu
    ascii_mode: 0
    # 換輸入框重置時，引擎對齊本頁 ascii_mode（畫面／引擎同步，否則畫面英文引擎注音）
    reset_ascii_mode: true
    # 密碼/email 欄位強制 .ascii 時切到英文佈局，不留在注音鍵帽上打英數
    ascii_keyboard: english
    width: 10
    height: 48
    lock: true
    keys:
      # 第1排：ㄅㄉˇˋㄓˊ˙ㄚㄞㄢㄦ（11鍵）
      - {label: 'ㄅ', click: '1', width: 9.09}
      - {label: 'ㄉ', click: '2', width: 9.09}
      - {label: 'ˇ', click: '3', width: 9.09}
      - {label: 'ˋ', click: '4', width: 9.09}
      - {label: 'ㄓ', click: '5', width: 9.09}
      - {label: 'ˊ', click: '6', width: 9.09}
      - {label: '˙', click: '7', width: 9.09}
      - {label: 'ㄚ', click: '8', width: 9.09}
      - {label: 'ㄞ', click: '9', width: 9.09}
      - {label: 'ㄢ', click: '0', width: 9.09}
      - {label: 'ㄦ', click: '-', width: 9.1}

      # 第2排：腰身留邊2.5，ㄆㄊㄍㄐㄔㄗㄧㄛㄟㄣ（10鍵）
      - {width: 2.5}
      - {label: 'ㄆ', click: q, width: 9.5}
      - {label: 'ㄊ', click: w, width: 9.5}
      - {label: 'ㄍ', click: e, width: 9.5}
      - {label: 'ㄐ', click: r, width: 9.5}
      - {label: 'ㄔ', click: t, width: 9.5}
      - {label: 'ㄗ', click: y, width: 9.5}
      - {label: 'ㄧ', click: u, width: 9.5}
      - {label: 'ㄛ', click: i, width: 9.5}
      - {label: 'ㄟ', click: o, width: 9.5}
      - {label: 'ㄣ', click: p, width: 9.5}
      - {width: 2.5}

      # 第3排：腰身留邊5，ㄇㄋㄎㄑㄕㄘㄨㄜㄠㄤ（10鍵）
      - {width: 5}
      - {label: 'ㄇ', click: a, width: 9}
      - {label: 'ㄋ', click: s, width: 9}
      - {label: 'ㄎ', click: d, width: 9}
      - {label: 'ㄑ', click: f, width: 9}
      - {label: 'ㄕ', click: g, width: 9}
      - {label: 'ㄘ', click: h, width: 9}
      - {label: 'ㄨ', click: j, width: 9}
      - {label: 'ㄜ', click: k, width: 9}
      - {label: 'ㄠ', click: l, width: 9}
      - {label: 'ㄤ', click: ';', width: 9}
      - {width: 5}

      # 第4排：ㄈㄌㄏㄒㄖㄙㄩㄝㄡㄥ＋⌫（⌫=10 同字根寬防誤觸）
      - {label: 'ㄈ', click: z, width: 9}
      - {label: 'ㄌ', click: x, width: 9}
      - {label: 'ㄏ', click: c, width: 9}
      - {label: 'ㄒ', click: v, width: 9}
      - {label: 'ㄖ', click: b, width: 9}
      - {label: 'ㄙ', click: n, width: 9}
      - {label: 'ㄩ', click: m, width: 9}
      - {label: 'ㄝ', click: ',', width: 9}
      - {label: 'ㄡ', click: '.', width: 9}
      - {label: 'ㄥ', click: '/', width: 9}
      - {click: BackSpace, width: 10, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}

      # 第5排：123 / 😀 / 空白（注 hint） / Enter——對齊 iOS 底排；#+= 走 123 進符號頁
      - {click: Keyboard_number, width: 18, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}
      - {click: liquid_keyboard_emoji, width: 18, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}
      - {click: space, width: 46, hint: "注", key_hint_offset_x: 55, key_hint_offset_y: -3, key_symbol_color: comment_text_color, hilited_key_symbol_color: hilited_comment_text_color}
      - {click: Return, width: 18, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}

      # 第6排（矮排）：地球（切英文） …… 麥克風（占位）
      - {click: Keyboard_english, height: 26, width: 15, key_back_color: keyboard_back_color, hilited_key_back_color: keyboard_back_color, round_corner: 0, key_shadow: false}
      - {width: 70, height: 26}
      - {click: Mic_placeholder, height: 26, width: 15, key_back_color: keyboard_back_color, hilited_key_back_color: keyboard_back_color, round_corner: 0, key_shadow: false}

  english:
    name: 英文鍵盤（收合）
    author: Hau Liu
    ascii_mode: 1
    # 換輸入框重置時，引擎對齊本頁 ascii_mode（畫面／引擎同步，否則畫面英文引擎注音）
    reset_ascii_mode: true
    width: 10
    height: 48
    lock: true
    keys:
      # 第1排：QWERTYUIOP（10鍵）
      - {click: q, width: 10}
      - {click: w, width: 10}
      - {click: e, width: 10}
      - {click: r, width: 10}
      - {click: t, width: 10}
      - {click: y, width: 10}
      - {click: u, width: 10}
      - {click: i, width: 10}
      - {click: o, width: 10}
      - {click: p, width: 10}

      # 第2排：ASDFGHJKL（9鍵，留邊5）
      - {width: 5}
      - {click: a, width: 10}
      - {click: s, width: 10}
      - {click: d, width: 10}
      - {click: f, width: 10}
      - {click: g, width: 10}
      - {click: h, width: 10}
      - {click: j, width: 10}
      - {click: k, width: 10}
      - {click: l, width: 10}
      - {width: 5}

      # 第3排：⇧ + ZXCVBNM + ⌫
      - {click: Shift_L, width: 15, key_text_size: 26, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}
      - {click: z, width: 10}
      - {click: x, width: 10}
      - {click: c, width: 10}
      - {click: v, width: 10}
      - {click: b, width: 10}
      - {click: n, width: 10}
      - {click: m, width: 10}
      - {click: BackSpace, width: 15, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}

      # 第4排：123（英文半形版）/ 符號 / 空白 / Enter
      - {click: Keyboard_number_en, width: 18, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}
      - {click: liquid_keyboard_emoji, width: 18, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}
      - {click: space, width: 46}
      - {click: Return, width: 18, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}

      # 第5排（矮排）：地球（切回注音） …… 麥克風（占位）
      - {click: Keyboard_zhuyin_globe, height: 26, width: 15, key_back_color: keyboard_back_color, hilited_key_back_color: keyboard_back_color, round_corner: 0, key_shadow: false}
      - {width: 70, height: 26}
      - {click: Mic_placeholder, height: 26, width: 15, key_back_color: keyboard_back_color, hilited_key_back_color: keyboard_back_color, round_corner: 0, key_shadow: false}

  number:
    name: 數字符號鍵盤
    author: Hau Liu
    ascii_mode: 1
    width: 10
    height: 48
    keys:
      # 第1排：1234567890
      - {click: '1', width: 10}
      - {click: '2', width: 10}
      - {click: '3', width: 10}
      - {click: '4', width: 10}
      - {click: '5', width: 10}
      - {click: '6', width: 10}
      - {click: '7', width: 10}
      - {click: '8', width: 10}
      - {click: '9', width: 10}
      - {click: '0', width: 10}

      # 第2排：＋－×÷＝開頭（加減乘除等於），後接（）＠／「」（全形標點直接送字）
      - {click: '＋', width: 10}
      - {click: '－', width: 10}
      - {click: '×', width: 10}
      - {click: '÷', width: 10}
      - {click: '＝', width: 10}
      - {click: '（', width: 10}
      - {click: '）', width: 10}
      - {click: '＠', width: 10}
      - {click: '／', width: 10}
      - {click: '「」', width: 10}

      # 第3排：#+=（進符號頁）／。／，／？／！／、／⌫
      - {click: Keyboard_symbol, width: 14.3, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}
      - {click: '。', width: 14.3}
      - {click: '，', width: 14.3}
      - {click: '？', width: 14.3}
      - {click: '！', width: 14.3}
      - {click: '、', width: 14.3}
      - {click: BackSpace, width: 14.2, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}

      # 第4排：注音（切回zhuyin） / 空白 / Enter
      - {click: Keyboard_zhuyin, width: 18, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}
      - {click: space, width: 64}
      - {click: Return, width: 18, key_back_color: function_key_back_color, hilited_key_back_color: function_key_hilited_back_color}

      # 第5排（矮排）：地球（切英文） …… 麥克風（占位）——與注音頁輪廓一致
      - {click: Keyboard_english, height: 26, width: 15, key_back_color: keyboard_back_color, hilited_key_back_color: keyboard_back_color, round_corner: 0, key_shadow: false}
      - {width: 70, height: 26}
      - {click: Mic_placeholder, height: 26, width: 15, key_back_color: keyboard_back_color, hilited_key_back_color: keyboard_back_color, round_corner: 0, key_shadow: false}

  # 英文模式的 123 頁（半形，iOS 英文數字頁）；注音模式用上面的 number（全形）
  number_en:
    name: 數字符號鍵盤（英文半形）
    author: dafa
    ascii_mode: 1
    width: 10
    height: 48
    keys:
      # 第1排：1234567890
      - {click: '1', width: 10}
      - {click: '2', width: 10}
      - {click: '3', width: 10}
