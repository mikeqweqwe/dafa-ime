name: Emulator smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/*-debug.apk
            adb logcat -c
            adb shell am start -n com.tumuyan.trime/com.osfans.trime.settings.PrefMainActivity || adb shell monkey -p com.tumuyan.trime -c android.intent.category.LAUNCHER 1
            sleep 150
            adb shell screencap -p /data/local/tmp/s1.png && adb pull /data/local/tmp/s1.png smoke-screen-150s.png
            adb logcat -d > smoke-logcat.txt
            adb shell "ps -A | grep -i trime" > smoke-ps.txt || true
            adb shell am start -n com.tumuyan.trime/com.osfans.trime.settings.PrefMainActivity || true
            sleep 60
            adb shell screencap -p /data/local/tmp/s2.png && adb pull /data/local/tmp/s2.png smoke-screen-210s.png
            adb logcat -d > smoke-logcat-full.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: |
            smoke-screen-*.png
            smoke-logcat*.txt
            smoke-ps.txt
