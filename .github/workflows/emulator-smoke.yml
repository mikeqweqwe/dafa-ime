name: Emulator smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/*-debug.apk
            adb logcat -c
            # 啟用大發輸入法並設為預設，給首次部署 90 秒
            adb shell ime enable com.tumuyan.trime/com.osfans.trime.TrimeImeService
            adb shell ime set com.tumuyan.trime/com.osfans.trime.TrimeImeService
            sleep 90
            adb shell "ps -A | grep -i trime" > smoke-ps-after-enable.txt || true
            # 開一個文字輸入框，逼鍵盤彈出
            adb shell am start -a android.intent.action.VIEW -d "https://example.com" com.android.chrome 2>/dev/null || adb shell am start -a android.intent.action.MAIN -n com.google.android.deskclock/com.android.deskclock.DeskClock 2>/dev/null || true
            adb shell input tap 500 400
            sleep 5
            adb shell dumpsys input_method > smoke-ime-dump.txt 2>&1 || true
            adb shell screencap -p /data/local/tmp/kb.png && adb pull /data/local/tmp/kb.png smoke-keyboard.png
            # 用測試 activity 直接叫鍵盤：塞一個 EditText via settings search
            adb shell am start -a android.settings.SETTINGS 2>/dev/null; sleep 2
            adb shell input tap 540 200; sleep 3
            adb shell screencap -p /data/local/tmp/kb2.png && adb pull /data/local/tmp/kb2.png smoke-keyboard2.png
            adb logcat -d > smoke-logcat-full.txt
            # 專抓 IME 程序的 crash
            adb logcat -d | grep -iE "TrimeIme|AndroidRuntime|FATAL|rime|deploy|onStartInput|onCreateInputView" > smoke-ime-log.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: |
            smoke-keyboard*.png
            smoke-ime*.txt
            smoke-logcat-full.txt
            smoke-ps-after-enable.txt
