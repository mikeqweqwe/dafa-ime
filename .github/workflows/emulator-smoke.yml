name: Emulator smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            (
              adb install app/build/outputs/apk/debug/*-debug.apk
              adb logcat -c
              adb shell ime enable com.tumuyan.trime/com.osfans.trime.TrimeImeService
              adb shell ime set com.tumuyan.trime/com.osfans.trime.TrimeImeService
              adb shell settings put secure show_ime_with_hard_keyboard 1
              adb shell am start -a android.settings.SETTINGS
              sleep 6
              adb shell input tap 540 240
              sleep 90
              adb shell "ps -A | grep -i trime" > smoke-ps.txt 2>&1
              adb shell dumpsys input_method > smoke-ime-dump.txt 2>&1
              adb exec-out screencap -p > smoke-keyboard.png
              adb logcat -d > smoke-logcat-full.txt 2>&1
              grep -iE "tumuyan|TrimeIme|AndroidRuntime|FATAL|Rime|deploy|onCreateInputView|Timber" smoke-logcat-full.txt > smoke-ime-log.txt 2>&1
            ) || true
            echo "smoke-script-finished"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: |
            smoke-keyboard*.png
            smoke-ime*.txt
            smoke-logcat-full.txt
            smoke-ps.txt
