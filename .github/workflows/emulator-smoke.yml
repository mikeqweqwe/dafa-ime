name: Emulator smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set +e
            adb install app/build/outputs/apk/debug/*-debug.apk || true
            adb logcat -c || true
            adb shell ime enable com.tumuyan.trime/com.osfans.trime.TrimeImeService || true
            adb shell ime set com.tumuyan.trime/com.osfans.trime.TrimeImeService || true
            adb shell settings put secure show_ime_with_hard_keyboard 1 || true
            # 開一個內建的文字輸入框：聯絡人搜尋一定有 EditText
            adb shell am start -a android.intent.action.INSERT -t vnd.android.cursor.dir/contact || true
            sleep 8
            adb shell input tap 540 300 || true
            sleep 90
            adb shell "ps -A | grep -i trime" > smoke-ps-after-enable.txt 2>&1
            adb shell dumpsys input_method > smoke-ime-dump.txt 2>&1
            adb exec-out screencap -p > smoke-keyboard.png
            adb shell input tap 540 500 || true
            sleep 8
            adb exec-out screencap -p > smoke-keyboard2.png
            adb logcat -d > smoke-logcat-full.txt 2>&1
            grep -iE "TrimeIme|AndroidRuntime|FATAL|E Rime|deploy|onStartInput|onCreateInputView|Timber" smoke-logcat-full.txt > smoke-ime-log.txt
            echo "done"
            true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: |
            smoke-keyboard*.png
            smoke-ime*.txt
            smoke-logcat-full.txt
            smoke-ps-after-enable.txt
